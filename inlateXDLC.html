function Icon({ name, size = 16, color = "currentColor", className = "", strokeWidth = 2, style, onClick }) {
  const d = ICONS[name];
  if (!d) return null;
  const mergedStyle = style || {};
  const strokeVal = mergedStyle.color ? "currentColor" : color;
  return (
    <svg onClick={onClick} width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={strokeVal} strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round" className={className} style={mergedStyle}>
      <path d={d} />
    </svg>
  );
}

        ...(token ? { Authorization: `Bearer ${token}` } : {}),

      setAuthStep("code");
      fire("Код отправлен на почту");

    setAuthBusy(false);
  };

  // ---------- Вход: шаг 1 ----------

    try {
      await api("/api/auth/login", { method: "POST", body: JSON.stringify({ email: loginEmail.trim(), password: loginPassword }) });
      setAuthStep("code");
      fire("Код отправлен на почту");

    setAuthBusy(false);

    const email = authMode === "register" ? regEmail.trim() : loginEmail.trim();
    const endpoint = authMode === "register" ? "/api/auth/register/confirm" : "/api/auth/login/confirm";
    setAuthBusy(true);
    try {
      const data = await api(endpoint, { method: "POST", body: JSON.stringify({ email, code: codeInput.trim() }) });
      setToken(data.token);
      setUser(data.user);
      fire("Аккаунт подтверждён");
    } catch (e) { fire(e.message); }
    setAuthBusy(false);
  };

  const logout = () => {
    setToken(null);
    setUser(null);
    setAuthStep("form");
    setCodeInput("");
    if (wsRef.current) wsRef.current.close();
  };

  // ---------- Чат: подключение по WebSocket после логина ----------
  useEffect(() => {
    if (!token) return;
    const ws = new WebSocket(`${WS_BASE}/ws/chat?token=${encodeURIComponent(token)}`);
    wsRef.current = ws;

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (data.type === "history") {
        setChatMsgs(data.messages.map((m, i) => ({ id: `h${i}`, login: m.login, text: m.text })));
      } else if (data.type === "message") {
        setChatMsgs((prev) => [...prev, { id: Date.now() + Math.random(), login: data.login, text: data.text }]);
      } else if (data.type === "online") {
        setOnlineUsers(data.users);
      }
    };
    ws.onerror = () => fire("Чат недоступен — бэкенд не отвечает");

    return () => ws.close();

                <p className="text-sm text-white/40 mt-1">Общайтесь с другими пользователями inlateXDLC</p>
              </div>
              <div className="grid md:grid-cols-3 gap-5">
                {[{ name: "Discord", desc: "Живое общение, объявления и голосовые каналы.", color: "#4c6ef5", url: "#" },
                  { name: "Telegram-канал", desc: "Короткие новости об обновлениях модулей.", color: "#3fb1e0", url: TELEGRAM_URL },
                  { name: "Форум", desc: "Гайды, конфиги и обсуждения от игроков.", color: "var(--accent)", url: "#" }].map((c) => (
                  <div key={c.name} className="rounded-2xl border border-white/10 bg-[#14161d]/85 backdrop-blur p-5">
                    <div className="h-9 w-9 rounded-lg mb-4" style={{ background: c.color }} />
                    <div className="font-semibold text-white mb-1">{c.name}</div>
                    <div className="text-sm text-white/45 mb-4">{c.desc}</div>
                    <a href={c.url} target="_blank" rel="noopener noreferrer" className="flex items-center gap-1 text-sm font-medium" style={{ color: "var(--accent)" }}>Перейти <Icon name="chevron-right" size={14} /></a>
                  </div>
                ))}
              </div>
            </>
          )}

          {tab === "tools" && (
            <>
              <div className="mb-6">
                <h1 className="text-2xl font-bold text-white" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Инструменты</h1>
                <p className="text-sm text-white/40 mt-1">Тикеты поддержки и служебные утилиты аккаунта</p>
              </div>
              <div className="rounded-2xl border border-white/10 bg-[#14161d]/85 backdrop-blur p-5 mb-5">
                <div className="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wider mb-4" style={{ color: "var(--accent)" }}><Icon name="ticket" size={12} /> Новый тикет</div>
                <div className="flex gap-2">
                  <input value={ticketText} onChange={(e) => setTicketText(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submitTicket()} placeholder="Опишите проблему коротко…"
                    className="flex-1 rounded-lg border border-white/10 bg-white/5 px-3.5 py-2.5 text-sm text-white placeholder-white/30 outline-none focus:border-white/30" />
                  <button onClick={submitTicket} className="flex items-center gap-1.5 rounded-lg px-4 py-2.5 text-sm font-semibold text-[#0b0c11]" style={{ background: "linear-gradient(135deg, var(--accent-light), var(--accent))" }}><Icon name="plus" size={15} /> Создать</button>
                </div>
              </div>
              <div className="rounded-2xl border border-white/10 bg-[#14161d]/85 backdrop-blur p-5">
                <div className="text-[11px] font-semibold uppercase tracking-wider text-white/40 mb-4"># Мои тикеты</div>
                <div className="flex flex-col gap-2">
                  {tickets.map((t) => (
                    <div key={t.id} className="flex items-center justify-between rounded-lg border border-white/5 bg-white/[0.03] px-4 py-3">
                      <div><div className="text-sm text-white/85">{t.subject}</div><div className="text-xs text-white/30">{t.date}</div></div>
                      <span className="text-xs rounded-full px-2.5 py-1" style={t.status === "Открыт" ? { background: "var(--accent-glow)", color: "var(--accent)" } : { background: "rgba(255,255,255,0.1)", color: "rgba(255,255,255,0.4)" }}>{t.status}</span>
                    </div>
                  ))}
                </div>
              </div>
            </>
          )}

          {tab === "docs" && (
            <>
              <div className="mb-6">
                <h1 className="text-2xl font-bold text-white" style={{ fontFamily: "'Space Grotesk', sans-serif" }}>Документация</h1>
                <p className="text-sm text-white/40 mt-1">Установка, настройка и часто задаваемые вопросы</p>
              </div>
              <div className="flex flex-col gap-3">
                {["Установка и первый запуск", "Привязка HWID к аккаунту", "Настройка модулей", "Активация ключа доступа", "Часто задаваемые вопросы"].map((d) => (
                  <div key={d} className="flex items-center justify-between rounded-xl border border-white/10 bg-[#14161d]/85 backdrop-blur p-4 cursor-pointer hover:border-white/20 transition-colors">
                    <div className="flex items-center gap-3"><Icon name="book-open" size={16} className="text-white/40" /><span className="text-sm text-white/85">{d}</span></div>
                    <Icon name="chevron-right" size={15} className="text-white/25" />
                  </div>
                ))}
              </div>
            </>
          )}
        </main>
      </div>

      <nav className="md:hidden flex items-center justify-around border-t border-white/10 py-2 backdrop-blur" style={{ background: "rgba(14,15,21,0.85)" }}>
        {NAV.slice(0, 5).map((n) => {
          const active = tab === n.id;
          return (
            <button key={n.id} onClick={() => setTab(n.id)} className="flex flex-col items-center gap-0.5 px-2 py-1" style={{ color: active ? "var(--accent)" : "rgba(255,255,255,0.4)" }}>
              <Icon name={n.icon} size={18} /><span className="text-[10px]">{n.label}</span>
            </button>
          );
        })}
      </nav>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Pyrite />);
</script>
</body>
</html>
